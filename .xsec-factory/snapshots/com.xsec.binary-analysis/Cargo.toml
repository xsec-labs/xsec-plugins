[workspace]
resolver = "2"
members = ["crates/binary-analysis-core", "crates/binary-analysis-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
librecurse = { git = "https://github.com/Recurse-Labs/recurse.git", rev = "59e38d503c91ff160fe013f20719714272d22184" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "2.1.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }

[profile.release]
# Symbols alone add ~4 MiB to the MCP executable, which counts toward the
# 100 MiB plugin package limit together with the engine bundle.
strip = "symbols"
