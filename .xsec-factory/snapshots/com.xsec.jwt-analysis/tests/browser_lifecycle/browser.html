<!doctype html><meta charset="utf-8"><title>JWT 生命周期真实边界检查</title>
<style>body{font:15px system-ui;max-width:1000px;margin:30px auto}button{padding:12px}pre{white-space:pre-wrap}iframe{width:100%;height:220px;border:1px solid #888}</style>
<h1>JWT 生命周期真实边界检查</h1>
<p>浏览器 DOM、真实计时器、loopback HTTP 与隔离 SQLite。组件检查范围为前端生命周期；Desktop 授权和 MCP 集成待单独验收。</p>
<button id="run">运行基线与修复检查</button><pre id="status">等待运行</pre><div id="view"></div>
<script type="module">
const button=document.querySelector('#run'),status=document.querySelector('#status'),view=document.querySelector('#view');
button.addEventListener('click',async()=>{
  button.disabled=true; const results=[];
  for(const variant of ['baseline','current']) for(const scenario of ['update','dispose-poll','dispose-pending','update-pending','failed-refresh']) {
    status.textContent=JSON.stringify({running:{variant,scenario},results},null,2);
    const frame=document.createElement('iframe');frame.src=`/case.html?variant=${variant}&scenario=${scenario}`;
    const result=await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>{window.removeEventListener('message',receive);reject(new Error('browser scenario exceeded 20 seconds'));},20000);
      function receive(event){if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.kind!=='case-result')return;clearTimeout(timeout);window.removeEventListener('message',receive);resolve(event.data.result)}
      window.addEventListener('message',receive);view.replaceChildren(frame);
    });
    results.push(result);frame.remove();
  }
  const current=results.filter(row=>row.variant==='current');
  const baseline=results.filter(row=>row.variant==='baseline');
  const report={boundary:'browser DOM, timers, HTTP and SQLite; Desktop Host and MCP not exercised',results,
    outcome:current.every(row=>row.passed)&&baseline.every(row=>!row.passed)?'passed':'failed'};
  status.textContent=JSON.stringify(report,null,2);
  const response=await fetch('/finish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(report)});
  if(!response.ok)throw new Error('browser result persistence failed');
});
</script>
